server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sensible defaults for a small SPA bundle.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 12m; # slightly above the backend's 10MB resume cap

    # Proxy API calls to the backend container (see docker-compose.yml).
    # The frontend's own fetch calls always use the relative "/api/v1/..."
    # base path (see frontend/src/lib/api.ts), so this is the only place
    # that needs to know the backend's real address.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s; # resume upload involves PDF parse + LLM call + embedding
    }

    # SPA fallback: any non-file, non-API route resolves to index.html so
    # client-side routing (react-router) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?|png|jpg|jpeg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
