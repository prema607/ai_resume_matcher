services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Persist uploaded resume PDFs across container restarts.
      - resume_storage:/app/storage_vaults
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  resume_storage:

# NOTE: MongoDB is intentionally not included as a service here.
# $vectorSearch (used in app/services/matcher.py) is an Atlas-managed
# aggregation stage -- point MONGODB_URI in .env at an Atlas cluster
# rather than a self-hosted `mongo` container, and create the vector
# index described in that file before running searches.
